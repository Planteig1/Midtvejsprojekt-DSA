<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midtvejsprojekt</title>
    <link rel="stylesheet" href="styling.css">
</head>
<body>
    <canvas id="canvas" width="1152" height="727">
        <img src="plane picture.png" alt="Sketch of plane" id="plane">
    </canvas>
    
    <!-- Existing seat price display -->
    <button onclick="displaySeatPrice()">Update and Display Seat Price</button>
    <p>Current Seat Price: <span id="displayedPrice">100</span></p>
    
    <h2>Seat map</h2>
    <div id="seat-grid"></div>

    <!-- NEW SIMULATION CONTROL SECTION -->
    <h2>Simulation Controls</h2>

    <!-- Start simulation button -->
    <button onclick="startSimulation()">Start Simulation</button>

    <!-- Change number of passengers -->
    <div>
        <label for="passengerCount">Number of Passengers:</label>
        <input type="number" id="passengerCount" min="1" value="50">
        <button onclick="updatePassengerCount()">Update</button>
    </div>

    <!-- Change seat price -->
    <div>
        <label for="seatPriceInput">Seat Price:</label>
        <input type="number" id="seatPriceInput" min="1" value="100">
        <button onclick="updateSeatPrice()">Update</button>
    </div>

    <!-- Change passenger budget fluctuation -->
    <div>
        <label for="budgetChangeInput">Budget Variation (±):</label>
        <input type="number" id="budgetChangeInput" min="0" value="50">
        <button onclick="updateBudgetVariation()">Update</button>
    </div>

    <!-- Change starting money -->
    <div>
        <label for="startingMoneyInput">Passenger Starting Money:</label>
        <input type="number" id="startingMoneyInput" min="0" value="500">
        <button onclick="updateStartingMoney()">Update</button>
    </div>

    <script src="booker.js"></script>
    <script src="plane.js"></script>
    <script src="passenger.js"></script>
    <script src="script.js"></script>
</body>
</html>
